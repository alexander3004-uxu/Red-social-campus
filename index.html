<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CampusLink - Red Social Universitaria</title>
    <meta name="description" content="Comunidad universitaria conectada: feed académico, salas de estudio pomodoro, marketplace estudiantil seguro y mensajería en tiempo real." />

    <!-- PWA Primary Color & Manifest -->
    <meta name="theme-color" content="#3525cd" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#3525cd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131b2e" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />

    <!-- Apple iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CampusLink" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Windows & Edge Tile Meta Tags -->
    <meta name="msapplication-TileColor" content="#3525cd" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Open Graph & Twitter Cards -->
    <meta property="og:title" content="CampusLink - Red Social Universitaria" />
    <meta property="og:description" content="Comunidad universitaria conectada: feed académico, salas de estudio pomodoro, marketplace estudiantil seguro y mensajería en tiempo real." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CampusLink - Red Social Universitaria" />
    <meta name="twitter:description" content="Comunidad universitaria conectada: feed académico, salas de estudio pomodoro, marketplace estudiantil seguro y mensajería en tiempo real." />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />

    <style>
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        visibility: hidden;
      }

      .fonts-loaded .material-symbols-outlined {
        visibility: visible;
      }
    </style>
  </head>

  <body class="h-full bg-[#faf8ff] text-[#131b2e] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      document.fonts.ready.then(() => {
        document.documentElement.classList.add('fonts-loaded');
      });
    </script>
  </body>
</html>
